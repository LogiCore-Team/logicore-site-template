services:
  # ========================================================
  # Yaqoot Storefront Web Service (TemplateSite)
  # ========================================================
  - type: web
    name: yaqoot-storefront
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 10000
      - key: PublicUrl__BaseUrl
        value: "https://yagot-wppl.onrender.com/"
      - key: ConnectionStrings__MYDB
        sync: false
      - key: ConnectionStrings__User
        sync: false
      - key: ConnectionStrings__UsersConnection
        sync: false
      # Control Panel Integration (Site #1)
      - key: YagotIntegration__SiteId
        value: "1"
      - key: YagotIntegration__ControlPanelBaseUrl
        value: "https://controlpanelsite-d7ta.onrender.com/"
      - key: YagotIntegration__SnapshotApiKey
        sync: false
      - key: YagotIntegration__WebhookKeyId
        value: "wh-key-prod-1"
      - key: YagotIntegration__WebhookSecret
        sync: false
      - key: YagotIntegration__TimestampToleranceSeconds
        value: "300"
      - key: YagotIntegration__ReconciliationIntervalMinutes
        value: "30"
      - key: YagotIntegration__SnapshotHttpTimeoutSeconds
        value: "10"
      - key: CapabilityIntegration__SiteId
        value: "1"
